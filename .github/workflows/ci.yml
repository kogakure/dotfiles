name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# One in-flight run per ref; a new push supersedes the old one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]

    steps:
      # The private submodule is not reachable from CI, so it is deliberately
      # left uninitialised. bin/dotfiles-lint excludes private/* for exactly
      # this reason.
      - uses: actions/checkout@v4
        with:
          submodules: false

      # fish and zsh are Homebrew/system packages on the real machines rather
      # than mise tools, so CI installs them the same way.
      - name: Install fish and zsh (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y fish zsh

      - name: Install fish (macOS)
        if: runner.os == 'macOS'
        run: brew install fish

      - name: Install mise
        uses: jdx/mise-action@v2
        with:
          install: false
          cache: true

      # Read the tool pins out of config/mise/mise.toml — the file that gets
      # symlinked to ~/.config/mise/mise.toml on a real machine — so CI runs
      # the exact versions the machines run and the two cannot drift apart.
      # A missing pin fails the job rather than silently floating to latest.
      #
      # Only the four tools the lint job needs, not all ~55: installing node,
      # ruby, rust and friends here would be slow and would fail for reasons
      # that have nothing to do with linting shell scripts.
      #
      # `just` has no pin to read — it is a Homebrew package on the machines.
      - name: Install the pinned lint tools
        run: |
          set -euo pipefail
          pin() {
            sed -n "s/^$1 *= *\"\([^\"]*\)\"\$/\1/p" config/mise/mise.toml | head -1
          }
          mkdir -p "$HOME/.config/mise"
          {
            echo '[tools]'
            for tool in shellcheck shfmt yq; do
              version=$(pin "$tool")
              if [ -z "$version" ]; then
                echo "::error file=config/mise/mise.toml::no version pin for '$tool'" >&2
                exit 1
              fi
              echo "$tool = \"$version\""
            done
            echo 'just = "latest"'
          } > "$HOME/.config/mise/mise.toml"
          cat "$HOME/.config/mise/mise.toml"
          mise install --yes
          # Mirror session-variables.sh: the shims go on PATH.
          echo "$HOME/.local/share/mise/shims" >> "$GITHUB_PATH"

      - name: Show tool versions
        run: |
          shellcheck --version
          shfmt --version
          yq --version
          just --version
          fish --version
          zsh --version
          bash --version | head -1

      # Proves no recipe secretly depends on cwd: invoke just by absolute path
      # to the Justfile from a directory outside the checkout.
      - name: just --list works from outside the repo
        run: |
          cd "$RUNNER_TEMP"
          just -f "$GITHUB_WORKSPACE/Justfile" --list

      # --strict turns a missing linter into a failure instead of a skip, so
      # this job can never go green by quietly checking nothing.
      - name: just lint-strict
        run: just lint-strict

      # The pre-commit hook must never be able to block the commit that fixes
      # a broken PATH. With PATH cut down to the system directories the linters
      # are unresolvable, and the hook has to exit 0 anyway.
      - name: pre-commit hook fails open on a broken PATH
        run: |
          set -uo pipefail
          out=$(env -i HOME="$HOME" PATH=/usr/bin:/bin .githooks/pre-commit 2>&1) && rc=0 || rc=$?
          printf '%s\n' "$out"
          if [ "${rc:-0}" -ne 0 ]; then
            echo "::error::pre-commit exited $rc under PATH=/usr/bin:/bin; it must fail open"
            exit 1
          fi
          case "$out" in
            *fail-open*) echo "OK: hook exited 0 and reported the fail-open path" ;;
            *)
              echo "::error::hook exited 0 but did not take the fail-open path"
              exit 1
              ;;
          esac

      # setup.sh dispatches steps by name, so the registry is data and a typo in
      # it is a runtime failure on a fresh machine rather than a syntax error.
      # `just lint unit` checks ALL_STEPS against the step_* functions; this
      # checks that the CLI around them still works.
      - name: setup.sh's step graph is parseable
        run: |
          set -uo pipefail
          ./setup.sh --help >/dev/null || { echo "::error::--help failed"; exit 1; }
          n=$(./setup.sh --list | grep -c .)
          ./setup.sh --list
          if [ "$n" -lt 15 ]; then
            echo "::error::--list produced only $n steps"
            exit 1
          fi
          # An unknown name must be rejected rather than silently doing nothing.
          if ./setup.sh --dry-run --only definitely-not-a-step >/dev/null 2>&1; then
            echo "::error::an unknown step name was accepted"
            exit 1
          fi
          echo "OK: $n steps, --help works, unknown names rejected"

      # An unresolvable host must fail loudly, not silently skip the longest
      # step in setup.sh. On macOS `hostname` returns the Bonjour name, which
      # changes with the network and reports something like Mac.local on a
      # fresh machine — so this is the normal state of a new host, not an edge
      # case.
      #
      # Runs on both legs and needs no Homebrew, which is exactly why
      # homebrew-restore resolves the Brewfile before it checks for brew. With
      # the checks in the other order this would fail on the Linux leg for the
      # wrong reason and prove nothing.
      - name: homebrew-restore rejects an unknown host
        run: |
          set -uo pipefail
          out=$(DOTFILES_HOST=definitely-not-a-host bin/homebrew-restore 2>&1) && rc=0 || rc=$?
          printf '%s\n' "$out"
          if [ "$rc" -eq 0 ]; then
            echo "::error::an unknown host was accepted"
            exit 1
          fi
          # The message has to name the real hosts, or it tells you nothing you
          # could act on.
          for f in homebrew/*; do
            host=${f##*/}
            case "$out" in
              *"$host"*) ;;
              *)
                echo "::error::the failure message does not name '$host'"
                exit 1
                ;;
            esac
          done
          echo "OK: exited $rc and named every available host"

      # A dry run has to be inert, and the only way to know is to do one and
      # look. Five steps are skipped because they need something CI does not
      # have — a hostname with a Brewfile, brew, dotbot, or the private
      # submodule — and skipping by name rather than listing what to keep means
      # a step added later is covered by default.
      - name: setup.sh --dry-run changes nothing
        run: |
          set -uo pipefail
          git status --porcelain >"$RUNNER_TEMP/before"
          if ! ./setup.sh --dry-run --skip preflight,packages,link,gnupg,macos </dev/null; then
            echo "::error::the dry run exited non-zero"
            exit 1
          fi
          git status --porcelain >"$RUNNER_TEMP/after"
          if ! diff -u "$RUNNER_TEMP/before" "$RUNNER_TEMP/after"; then
            echo "::error::the dry run modified the working tree"
            exit 1
          fi
          if [ -e "${XDG_STATE_HOME:-$HOME/.local/state}/dotfiles/setup-state" ]; then
            echo "::error::the dry run wrote a state file"
            exit 1
          fi
          echo "OK: the dry run changed nothing and wrote no state"

      # Guards the highest-value check in the suite. A runtime `source` of the
      # startup files is the only thing that catches a fish-syntax alias in a
      # POSIX file — the regression that shipped to three machines, which
      # `bash -n` parses without complaint. Prove the check can still fail.
      # The alias file is generated now, so the mutation goes there. That makes
      # this check matter more, not less: a generator bug reaches every shell
      # at once.
      - name: POSIX source test detects a fish-syntax alias
        run: |
          set -euo pipefail
          cp generated/aliases.sh "$RUNNER_TEMP/aliases.orig"
          printf '\nalias broken "echo nope"\n' >> generated/aliases.sh
          if bin/dotfiles-lint posix; then
            cp "$RUNNER_TEMP/aliases.orig" generated/aliases.sh
            echo "::error::the POSIX source test passed on a fish-syntax alias"
            exit 1
          fi
          cp "$RUNNER_TEMP/aliases.orig" generated/aliases.sh
          git diff --exit-code -- generated/aliases.sh
          echo "OK: the POSIX source test rejects a fish-syntax alias"

      # The drift gate's whole job is to stop a hand-edit to a generated file
      # from surviving, so prove it still rejects one. The edit has to be
      # *staged*: the check regenerates the worktree first, so an unstaged edit
      # is simply repaired and there is nothing left to detect. Staging is what
      # a committed hand-edit looks like to `git diff`.
      - name: drift check rejects a hand-edited generated file
        run: |
          set -euo pipefail
          cp generated/aliases.sh "$RUNNER_TEMP/aliases.sh.orig"
          printf '\nalias hand_edited=oops\n' >> generated/aliases.sh
          git add generated/aliases.sh
          if bin/dotfiles-lint drift; then
            cp "$RUNNER_TEMP/aliases.sh.orig" generated/aliases.sh
            git add generated/aliases.sh
            echo "::error::the drift check passed on a hand-edited generated file"
            exit 1
          fi
          cp "$RUNNER_TEMP/aliases.sh.orig" generated/aliases.sh
          git add generated/aliases.sh
          git diff --cached --exit-code -- generated/aliases.sh
          echo "OK: the drift check rejects a hand-edited generated file"

      # The reason this phase exists. `git` used to resolve to /usr/bin/git in
      # bash and /opt/homebrew/bin/git in fish, because the POSIX file
      # prepended the system directories while fish appended them. One spec has
      # to mean one PATH, byte for byte, or the divergence is back.
      - name: bash and fish build the same PATH
        run: |
          set -euo pipefail
          # Resolve the interpreters before `env -i` strips PATH. Homebrew puts
          # fish in /opt/homebrew/bin on the macOS runner, which is not in the
          # minimal PATH handed to the child, so a bare `fish` exits 127.
          BASH_BIN=$(command -v bash)
          FISH_BIN=$(command -v fish)
          b=$(env -i HOME="$HOME" PATH=/usr/bin:/bin "$BASH_BIN" --noprofile --norc \
                -c '. generated/session-variables.sh >/dev/null 2>&1; echo "$PATH"')
          f=$(env -i HOME="$HOME" PATH=/usr/bin:/bin "$FISH_BIN" --no-config \
                -c 'for x in config/fish/conf.d/00-env.fish config/fish/conf.d/10-path.fish
                      source $x
                    end
                    string join ":" $PATH' 2>/dev/null)
          if [ "$b" != "$f" ]; then
            echo "::error::bash and fish disagree about PATH"
            diff <(printf '%s' "$b" | tr ':' '\n') <(printf '%s' "$f" | tr ':' '\n') || true
            exit 1
          fi
          dupes=$(printf '%s' "$b" | tr ':' '\n' | grep . | sort | uniq -d || true)
          if [ -n "$dupes" ]; then
            echo "::error::the generated PATH contains duplicates: $dupes"
            exit 1
          fi
          echo "OK: bash and fish agree on PATH, with no duplicates"
