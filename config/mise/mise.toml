# Global mise config -> ~/.config/mise/mise.toml
#
# This is the ONLY mise config in this repo. Do not add a project-local
# mise.toml at the repo root: tools declared there resolve only while the cwd
# is inside ~/.dotfiles, which silently breaks every bash script, cron job and
# non-repo shell (SI-118).
#
# CLI tools are pinned to exact versions. Language runtimes and a few
# self-updating helpers stay on "latest".
#
# Deliberately NOT owned by mise:
#   tmux            - Homebrew. Long-running server and parent of every shell;
#                     a shim that vanishes on a config-resolution change is a
#                     far worse failure mode than a slightly stale binary.
#   postgres        - Homebrew postgresql@14, which owns the existing cluster
#                     in /opt/homebrew/var/postgresql@14.
#   youtube-dl      - Homebrew yt-dlp; `aliases` redirects youtube-dl to it.
#   claude-code     - duplicate of `claude` (same aqua:anthropics/claude-code
#                     package, same `claude` binary).
#
# Four tools are declared twice, once per architecture. atuin, delta, fd and
# pnpm are pinned to aqua packages that publish no darwin/amd64 build, so on
# macbook-2019 `mise install` failed outright and — with
# not_found_auto_install below — each one then retried and failed at whatever
# moment it was first invoked, breaking the shell when you reached for `fd`
# rather than when you set the machine up (SI-120).
#
# The `os` field takes `os/arch` pairs as well as bare OS names, and mise skips
# an entry whose pair does not match the host. So each of the four names the
# fast prebuilt backend for Apple Silicon and Linux, and a source-built one for
# Intel macOS only. The Intel entries compile, which is slow on that machine's
# first install and is the accepted cost of keeping all four under mise on
# every host rather than splitting provisioning across two package managers.
#
# Do not "simplify" these to a single `arch = [...]` key: mise has no such
# field and silently ignores it, leaving both entries active. The arch belongs
# inside `os`, and the backend name is not always guessable from the tool name
# — delta is cargo:git-delta and fd is cargo:fd-find, both because the short
# name was already taken on crates.io.

[tools]
atuin = { version = "18.19.0", os = ["macos/arm64", "linux"] }
"cargo:atuin" = { version = "18.19.0", os = ["macos/x64"] }
bat = "0.26.1"
bat-extras = "2024.08.24"
bun = "latest"
claude = "2.1.235"
codex = "0.147.0"
delta = { version = "0.19.2", os = ["macos/arm64", "linux"] }
"cargo:git-delta" = { version = "0.19.2", os = ["macos/x64"] }
deno = "latest"
direnv = "latest"
docker-cli = "29.7.2"
eza = "0.23.5"
fd = { version = "10.4.2", os = ["macos/arm64", "linux"] }
"cargo:fd-find" = { version = "10.4.2", os = ["macos/x64"] }
fzf = "0.74.2"
gh = "2.97.0"
git-lfs = "3.7.1"
gitleaks = "8.30.1"
go = "latest"
grok = "1.0.5"
herdr = "0.8.0"
hunk = "0.19.0"
hunkdiff = "0.19.0"
jj = "0.44.0"
jq = "1.8.2"
lazydocker = "0.25.2"
lazygit = "0.64.1"
lazyssh = "0.3.0"
lua = "latest"
neovim = "0.12.4"
node = "22.17.1"
"npm:playwright-cli" = "latest"
opencode = "1.18.18"
oxlint = "1.79.0"
pandoc = "3.10.2"
pi = "0.84.2"
pnpm = { version = "11.22.0", os = ["macos/arm64", "linux"] }
"npm:pnpm" = { version = "11.22.0", os = ["macos/x64"] }
prettier = "3.9.6"
python = "latest"
ripgrep = "15.2.0"
ruby = "3.4.2"
rust = "latest"
shellcheck = "0.11.0"
shfmt = "3.13.1"
sqlite = "3.53.4"
starship = "1.26.0"
superfile = "1.6.0"
typst = "0.15.1"
usage = "latest"
uv = "0.12.5"
worktrunk = "0.74.0"
yazi = "26.8.15"
yq = "4.53.4"
zoxide = "0.10.0"

[settings]
idiomatic_version_file_enable_tools = ["ruby", "node"]
not_found_auto_install = true
