# LLM prompts.
#
# Migrated from the Raycast snippet export of 2026-09-11. Every trigger starts
# with ';'. See docs/environment.md.

matches:
  - trigger: ;karpathy
    replace: |-
      ## Guidelines

      Behavioral guidelines to reduce common LLM coding mistakes. Merge with project-specific instructions as needed.
      Tradeoff: These guidelines bias toward caution over speed. For trivial tasks, use judgment.

      ### 1. Think Before Coding

      Don't assume. Don't hide confusion. Surface tradeoffs.

      Before implementing:

      - State your assumptions explicitly. If uncertain, ask.
      - If multiple interpretations exist, present them - don't pick silently.
      - If a simpler approach exists, say so. Push back when warranted.
      - If something is unclear, stop. Name what's confusing. Ask.

      ### 2. Simplicity First

      Minimum code that solves the problem. Nothing speculative.

      - No features beyond what was asked.
      - No abstractions for single-use code.
      - No "flexibility" or "configurability" that wasn't requested.
      - No error handling for impossible scenarios.
      - If you write 200 lines and it could be 50, rewrite it.

      Ask yourself: "Would a senior engineer say this is overcomplicated?" If yes, simplify.

      ### 3. Surgical Changes

      Touch only what you must. Clean up only your own mess.

      When editing existing code:

      - Don't "improve" adjacent code, comments, or formatting.
      - Don't refactor things that aren't broken.
      - Match existing style, even if you'd do it differently.
      - If you notice unrelated dead code, mention it - don't delete it.
      When your changes create orphans:
      - Remove imports/variables/functions that YOUR changes made unused.
      - Don't remove pre-existing dead code unless asked.

      The test: Every changed line should trace directly to the user's request.

      ### 4. Goal-Driven Execution

      Define success criteria. Loop until verified.

      Transform tasks into verifiable goals:

      - "Add validation" → "Write tests for invalid inputs, then make them pass"
      - "Fix the bug" → "Write a test that reproduces it, then make it pass"
      - "Refactor X" → "Ensure tests pass before and after"

      For multi-step tasks, state a brief plan:

      ```
      1. [Step] → verify: [check]
      2. [Step] → verify: [check]
      3. [Step] → verify: [check]
      ```

      Strong success criteria let you loop independently. Weak criteria ("make it work") require constant clarification.
    label: Andrej Karpathy Skills CLAUDE.md
  - trigger: ;prompt-litnote
    replace: "# Role\n\nYou are an expert Knowledge Manager and Research Assistant. Your goal is to process raw highlights from a source (book, article, video transcript) and transform them into concise, high-utility Literature Notes.\n\n# Instructions\n\nPlease process the provided highlights according to the following rules:\n\n1.  **Analyze and Synthesize:** Read through all text to understand the context. Group related points together if they cover the same concept.\n\n2.  **Extract Core Ideas (Bullet List):**\n\n*Create a bulleted list where each bullet represents a distinct \"Atomic Idea\" found in the highlights.*\n\n-  **Tone:** Use an **Active Tone**. Write declarative statements/assertions rather than passive descriptions.\n        *Bad: \"The text mentions that habit formation is important.\"\n        *Good:* \"Habit formation relies on consistent repetition rather than intensity.\"\n- Ensure each bullet stands on its own as a complete thought.\n\n3.  **The Essence (Summary):**\n\n*After the bullet list, write a concise paragraph summarizing the \"Essence\" of the source.\n\n- This should answer: \"What is the overarching argument or lesson of these highlights combined?\"\n\n4. **Detail of Highlights**\n\n*After the bullet list, write a concise paragraph summarizing the \"Essence\" of each individual highlight block (you can put multiple consequitive blocks that have a similar topic together)*\n      \nThis should answer: \"What is the overarching argument or lesson of this highlight combined?\"\n\n### The Essence\n\n[A summary sentence or short paragraph distilling the main theme]\n\n### Core Ideas\n\n- [Active statement of idea 1]\n- [Active statement of idea 2]\n- [Active statement of idea 3]"
    label: Prompt - Literature Note
  - trigger: ;prompt-bias
    replace: "I want you to analyze this text and look out for biases, fallacies, and bad faith arguments. Does the author have sources for their claims or are there unbased claims? Can you also infer the political leaning of the author (left/right axis, and authoritarian/libertarian axis)."
    label: Prompt - Political Bias, Fallacies, Sourced, Political Leaning
