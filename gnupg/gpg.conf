auto-key-retrieve
no-emit-version
use-agent

# This one stays in the public repo, unlike the identity in private/git,
# private/jj and private/doom. A key fingerprint is public key material — it is
# what you publish to a keyserver so other people can find and verify the key,
# and it grants nothing to whoever reads it. gpg.conf also has no include
# mechanism, so hiding it would mean moving this whole file into the private
# submodule and losing public review of the three settings above, for no
# security gain. See SI-84.
default-key F0CF1CF481C2E3AA0F806A378BD4525D7A7253E8
