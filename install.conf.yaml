- defaults:
    link:
      relink: true

# Every directory this file links *into* needs cleaning, not just ~. With "~"
# alone, deleting a config/* entry left a dangling link in ~/.config forever.
- clean: ["~", "~/.config", "~/.gnupg", "~/.warp"]

# These are the parents the links below need. setup.sh also mkdirs ~/.config and
# ~/.gnupg, but only declaring them here makes `./install` work standalone on a
# fresh machine — without them the ~/.config/* and ~/.gnupg/*.conf links have no
# parent directory and fail.
#
# Note that `mode:` applies only when dotbot creates the directory. On a path
# that already exists the plugin returns early and never chmods, so these are
# not a repair for existing permissions on any current machine.
- create:
    ~/.config:
      mode: 0755
    # jj reads ~/.jjconfig.toml *and* ~/.config/jj/config.toml, merging both.
    # The identity lives in the second so it can come from private/.
    ~/.config/jj:
      mode: 0755
    ~/.gnupg:
      mode: 0700
    ~/.ssh:
      mode: 0700
    ~/.warp:
      mode: 0755

- link:
    ~/.config/:
      glob: true
      path: config/*
      relink: true
      exclude: [config/karabiner]
    ~/.config/karabiner: darwin/karabiner
    ~/.ack: ack
    ~/.ag: ag
    ~/.agents: private/agents
    # Trap: ~/.config/git is itself a symlink to config/git (created by the glob
    # above), so these two write *through* it — dotbot ends up creating symlinks
    # inside this repo's working tree at config/git/config-{personal,work}. They
    # are hidden only by a nested config/git/.gitignore containing `config-*`.
    # One rename away from a permanently dirty repo. Do not "tidy" that ignore.
    ~/.config/git/config-personal: private/git/config-personal
    ~/.config/git/config-work: private/git/config-work
    ~/.config/jj/config.toml: private/jj/config.toml
    # Generated from shell/*.spec by bin/generate-shell-config. The old
    # hand-written `aliases` and `session-variables.sh` at the repo root are
    # gone; `just generate` rewrites these.
    ~/.aliases: generated/aliases.sh
    ~/.hooks.bash: generated/hooks.bash
    ~/.hooks.zsh: generated/hooks.zsh
    # fish's hooks are sourced from the bottom of config.fish, not from conf.d
    # — see the comment there.
    ~/.hooks.fish: generated/hooks.fish
    ~/.bash_profile: bash_profile
    ~/.bashrc: bashrc
    ~/.ctags: ctags
    ~/.curlrc: curlrc
    ~/.default-gems: default-gems
    ~/.default-npm-packages: default-npm-packages
    ~/.default-python-packages: default-python-packages
    ~/.editorconfig: editorconfig
    ~/.functions: functions
    ~/.gemrc: gemrc
    ~/.gitmux.conf: gitmux.conf
    ~/.gnupg/dirmngr.conf: gnupg/dirmngr.conf
    # This entry carried `force: true` until 2026-08-31, because on every
    # existing machine the path was a real file — setup.sh used to append the
    # pinentry line to it on every run, and relink only ever replaces symlinks,
    # so without force ./install exited 1. All three machines are converted now
    # (`just doctor links` reports no "not a symlink: ~/.gnupg/gpg-agent.conf"
    # on any of them), so the flag is gone: while it was here, a real file that
    # someone deliberately put at this path would have been destroyed silently
    # by the next ./install (SI-86).
    #
    # If a host ever regresses to a real file, the failure is loud and harmless
    # — dotbot refuses the link and exits 1, and `just doctor links` names the
    # path. Do not add force back to silence that; look at the file first.
    ~/.gnupg/gpg-agent.conf: gnupg/gpg-agent.conf
    ~/.gnupg/gpg.conf: gnupg/gpg.conf
    ~/.jjconfig.toml: jjconfig.toml
    ~/.markdownlint.yaml: .markdownlint.yaml
    ~/.pi: pi
    ~/.profile: profile
    ~/.session-variables.sh: generated/session-variables.sh
    ~/.wakatime.cfg: private/wakatime.cfg
    ~/.warp/settings.toml: warp/settings.toml
    ~/.warp/tab_configs: warp/tab_configs
    ~/.wget: wget
    ~/.zsh_plugins.txt: zsh_plugins.txt
    ~/.zshenv: zshenv
    ~/.zshrc: zshrc

# No `shell:` block on purpose. It used to re-run `git submodule update` and the
# tmux plugin install, both of which setup.sh already does — the submodule init
# has to happen *before* ./install so private/* is there to link, and the tmux
# install has to happen *after* brew and after this file has linked config/tmux.
# Neither ordering is expressible here, and duplicating them made the tmux
# plugin install run three times per setup.
