# The identity — [user] and the signing key — lives in private/jj/config.toml,
# linked to ~/.config/jj/config.toml. jj reads both that and ~/.jjconfig.toml
# (this file) and merges them, so everything reviewable stays here.

[ui]
default-command = "log"
paginate = "never"

[lazyjj]
diff-format = "color-words"

[revsets]
immutable = "main@origin | master@origin"

[signing]
backend = "gpg"
behavior = "own"
# key = … see private/jj/config.toml
